---
- name: Install NodeSource signing key
  ansible.builtin.apt_key:
    url: https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key
    state: present

- name: Add NodeSource Node.js {{ nodejs_major_version }} repository
  ansible.builtin.apt_repository:
    repo: "deb https://deb.nodesource.com/node_{{ nodejs_major_version }}.x nodistro main"
    filename: nodesource
    state: present
    update_cache: yes

- name: Pin NodeSource packages
  ansible.builtin.copy:
    dest: /etc/apt/preferences.d/nodesource
    owner: root
    group: root
    mode: "0644"
    content: |
      Package: nodejs
      Pin: origin deb.nodesource.com
      Pin-Priority: 1001

- name: Install Node.js {{ nodejs_major_version }}
  ansible.builtin.apt:
    name: nodejs
    state: present
    update_cache: yes

- name: Enable Corepack
  ansible.builtin.command: corepack enable
  changed_when: false

- name: Activate pnpm through Corepack
  ansible.builtin.command: "corepack prepare pnpm@{{ pnpm_version }} --activate"
  changed_when: false

- name: Show installed Node.js version
  ansible.builtin.command: node --version
  register: cafco_node_version
  changed_when: false

- name: Assert Node.js major version
  ansible.builtin.assert:
    that:
      - "cafco_node_version.stdout is match('^v' ~ nodejs_major_version ~ '\\.')"
    fail_msg: "Expected Node.js {{ nodejs_major_version }}, got {{ cafco_node_version.stdout }}"
