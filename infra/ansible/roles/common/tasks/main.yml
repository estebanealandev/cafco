---
- name: Install common operating system packages
  ansible.builtin.apt:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - git
      - gnupg
      - htop
      - jq
      - locales
      - logrotate
      - lsb-release
      - python3-apt
      - rsync
      - software-properties-common
      - unattended-upgrades
      - unzip
      - wget
    state: present
    update_cache: yes
    cache_valid_time: 3600

- name: Configure timezone
  ansible.builtin.command: "timedatectl set-timezone {{ timezone }}"
  changed_when: false

- name: Ensure locale is enabled
  ansible.builtin.lineinfile:
    path: /etc/locale.gen
    regexp: "^#?{{ locale | regex_escape }} UTF-8"
    line: "{{ locale }} UTF-8"
  register: cafco_locale_gen

- name: Generate locales
  ansible.builtin.command: locale-gen
  when: cafco_locale_gen.changed
  changed_when: true

- name: Persist default locale
  ansible.builtin.copy:
    dest: /etc/default/locale
    owner: root
    group: root
    mode: "0644"
    content: |
      LANG={{ locale }}
      LC_ALL={{ locale }}

- name: Check swap file
  ansible.builtin.stat:
    path: "{{ swap_file_path }}"
  register: cafco_swap_file

- name: Allocate swap file
  ansible.builtin.command: "fallocate -l {{ swap_size_mb }}M {{ swap_file_path }}"
  when: not cafco_swap_file.stat.exists
  changed_when: true

- name: Set swap file permissions
  ansible.builtin.file:
    path: "{{ swap_file_path }}"
    owner: root
    group: root
    mode: "0600"

- name: Format swap file
  ansible.builtin.command: "mkswap {{ swap_file_path }}"
  when: not cafco_swap_file.stat.exists
  changed_when: true

- name: Enable swap file immediately
  ansible.builtin.command: "swapon {{ swap_file_path }}"
  when: not cafco_swap_file.stat.exists
  changed_when: true

- name: Persist swap in fstab
  ansible.builtin.mount:
    name: none
    src: "{{ swap_file_path }}"
    fstype: swap
    opts: sw
    passno: "0"
    dump: "0"
    state: present

- name: Configure kernel and network hardening
  ansible.builtin.copy:
    dest: /etc/sysctl.d/99-cafco.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      fs.file-max = 2097152
      net.core.somaxconn = 4096
      net.ipv4.tcp_syncookies = 1
      net.ipv4.tcp_fin_timeout = 15
      net.ipv4.tcp_keepalive_time = 1200
      net.ipv4.ip_forward = 0
      net.ipv4.conf.all.accept_redirects = 0
      net.ipv4.conf.default.accept_redirects = 0
      net.ipv4.conf.all.secure_redirects = 0
      net.ipv4.conf.default.secure_redirects = 0
      net.ipv4.conf.all.send_redirects = 0
      net.ipv4.conf.default.send_redirects = 0
      net.ipv4.conf.all.rp_filter = 1
      net.ipv4.conf.default.rp_filter = 1
      net.ipv6.conf.all.accept_redirects = 0
      net.ipv6.conf.default.accept_redirects = 0
      vm.swappiness = 10
  notify: Reload sysctl

- name: Configure systemd journald limits
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Write systemd journald limits
  ansible.builtin.copy:
    dest: /etc/systemd/journald.conf.d/99-cafco.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      [Journal]
      SystemMaxUse=512M
      RuntimeMaxUse=128M
      RateLimitIntervalSec=30s
      RateLimitBurst=10000
  notify: Restart journald

- name: Enable unattended upgrades
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    owner: root
    group: root
    mode: "0644"
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
      APT::Periodic::AutocleanInterval "7";

- name: Configure unattended upgrade behavior
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/51cafco-unattended-upgrades
    owner: root
    group: root
    mode: "0644"
    content: |
      Unattended-Upgrade::Automatic-Reboot "true";
      Unattended-Upgrade::Automatic-Reboot-Time "04:00";
      Unattended-Upgrade::Remove-Unused-Dependencies "true";

- name: Configure deploy user limits
  ansible.builtin.copy:
    dest: /etc/security/limits.d/99-cafco.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      {{ app_user }} soft nofile 65535
      {{ app_user }} hard nofile 65535
      www-data soft nofile 65535
      www-data hard nofile 65535

- name: Configure logrotate for Cafco logs
  ansible.builtin.copy:
    dest: /etc/logrotate.d/cafco
    owner: root
    group: root
    mode: "0644"
    content: |
      /var/log/cafco/*.log {
          daily
          rotate 14
          compress
          delaycompress
          missingok
          notifempty
          copytruncate
          create 0640 {{ app_user }} {{ app_group }}
      }
